<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-machine {
            background: #2c3e50;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .screen {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            padding: 20px;
            background: #34495e;
            border-radius: 15px;
            border: 3px solid #ecf0f1;
        }

        .reel {
            width: 120px;
            height: 120px;
            background: linear-gradient(180deg, #ecf0f1, #bdc3c7);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            color: #2c3e50;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        .reel.spinning {
            animation: spin 0.3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }

        .controls {
            margin: 20px 0;
        }

        .spin-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(231, 76, 60, 0.4);
        }

        .spin-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .balance {
            color: #f39c12;
            font-size: 1.5em;
            margin: 20px 0;
            font-weight: bold;
        }

        .result {
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 40px;
        }

        .win { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; }
        .lose { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="slot-machine">
        <h1>🎰 SLOT DEMO</h1>
        
        <div class="balance">Saldo: <span id="balance">10000</span></div>
        
        <div class="screen">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🍊</div>
        </div>

        <div class="controls">
            <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN (100)</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        // Simbol-simbol slot
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🔔', '⭐', '💎', '7️⃣'];
        
        // Komposisi probabilitas (RTP ~85%)
        const symbolWeights = {
            '🍒': 25, '🍋': 25, '🍊': 20, '🍇': 15,
            '🔔': 5, '⭐': 3, '💎': 2, '7️⃣': 5
        };

        let balance = 10000;
        let isSpinning = false;

        // Fungsi weighted random
        function getRandomSymbol() {
            const totalWeight = Object.values(symbolWeights).reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            
            for (let symbol in symbolWeights) {
                random -= symbolWeights[symbol];
                if (random <= 0) return symbol;
            }
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        // Fungsi cek kemenangan
        function checkWin(reel1, reel2, reel3) {
            if (reel1 === reel2 && reel2 === reel3) {
                // Jackpot berdasarkan simbol
                const payouts = {
                    '🍒': 200, '🍋': 300, '🍊': 400, '🍇': 500,
                    '🔔': 1000, '⭐': 2000, '💎': 5000, '7️⃣': 10000
                };
                return payouts[reel1] || 100;
            }
            return 0;
        }

        // Fungsi spin utama
        function spin() {
            if (isSpinning || balance < 100) return;
            
            isSpinning = true;
            balance -= 100;
            updateBalance();
            
            const spinBtn = document.getElementById('spinBtn');
            const reels = ['reel1', 'reel2', 'reel3'];
            
            // Start spinning animation
            reels.forEach(reel => {
                document.getElementById(reel).classList.add('spinning');
            });
            
            spinBtn.disabled = true;
            spinBtn.textContent = 'SPINNING...';
            
            // Generate hasil setelah delay
            setTimeout(() => {
                const results = [
                    getRandomSymbol(),
                    getRandomSymbol(),
                    getRandomSymbol()
                ];
                
                // Stop animation secara berurutan
                reels.forEach((reel, index) => {
                    setTimeout(() => {
                        document.getElementById(reel).classList.remove('spinning');
                        document.getElementById(reel).textContent = results[index];
                    }, index * 300);
                });
                
                setTimeout(() => {
                    const winAmount = checkWin(results[0], results[1], results[2]);
                    if (winAmount > 0) {
                        balance += winAmount;
                        document.getElementById('result').innerHTML = 
                            `🎉 JACKPOT! Menang ${winAmount.toLocaleString()}!`;
                        document.getElementById('result').className = 'result win';
                    } else {
                        document.getElementById('result').textContent = 'Coba lagi!';
                        document.getElementById('result').className = 'result lose';
                    }
                    
                    updateBalance();
                    spinBtn.disabled = false;
                    spinBtn.textContent = 'SPIN (100)';
                    isSpinning = false;
                }, 1000);
                
            }, 500);
        }

        function updateBalance() {
            document.getElementById('balance').textContent = 
                balance.toLocaleString();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                spin();
            }
        });
    </script>
</body>
</html>
