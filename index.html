<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Terakhir</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow-y: auto; /* Ubah dari hidden ke auto */
            color: white;
            padding: 40px 20px;
        }

        /* Canvas untuk background hati */
        #canvas {
            position: fixed; /* Ubah dari absolute ke fixed */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Kontainer Utama */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            margin: auto;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 1s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            color: #ffdde1;
        }

        /* Tombol Buka Pesan */
        .btn-buka {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn-buka:hover {
            background: white;
            color: #302b63;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Konten Pesan (Tersembunyi dulu) */
        .isi-pesan {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            margin-top: 30px;
            line-height: 1.8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left; /* Biar teks rapih dikiri-kanan */
        }

        .isi-pesan.show {
            display: block;
            animation: showText 2s ease forwards;
        }

        @keyframes showText {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CSS untuk scrollbar（元美化） */
        .isi-pesan::-webkit-scrollbar {
            width: 8px;
        }
        
        .isi-pesan::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        
        .isi-pesan::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .tanda-tangan {
            margin-top: 30px;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #ffdde1;
            text-align: center;
        }

    </style>
</head>
<body>

    <!-- Background Animation -->
    <canvas id="canvas"></canvas>

    <div class="container">
        <h1>Untuk Kamu</h1>
        
        <button class="btn-buka" onclick="bukaPesan()">Buka Pesan Ini</button>

        <div class="isi-pesan" id="isiPesan">
            <p>
                Pertama-tama, terima kasih sudah membaca ini.<br><br>
          btw aku ayam<br><br>
            </p>
            <div class="tanda-tangan">dari Aku bsk ayam</div>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---

        // 1. Fungsi Membuka Pesan
        function bukaPesan() {
            const btn = document.querySelector('.btn-buka');
            const pesan = document.getElementById('isiPesan');
            
            // Hilangkan tombol
            btn.style.transition = "all 0.5s";
            btn.style.opacity = "0";
            setTimeout(() => {
                btn.style.display = "none";
            }, 500);

            // Munculkan pesan
            setTimeout(() => {
                pesan.classList.add('show');
            }, 300);
        }

        // 2. Animasi Hati Melayang di Background
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        // Membuat kelas particle (hati)
        class HeartParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - 50;
                this.size = Math.random() * 5 + 1; // Ukuran random
                this.speedY = Math.random() * 1 - 0.5;
                this.color = "rgba(255, 255, 255," + Math.random() + ")";
                this.initialX = this.x;
            }
            update() {
                this.y -= this.speedY; // Bergerak ke atas
                // Oscilasi halus ke kiri kanan
                this.x += Math.sin(this.y * 0.01) * 0.5;

                // Jika keluar layar atas, muncul kembali di bawah
                if (this.y < 0 - this.size) {
                    this.y = canvas.height + this.size;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Membuat shape hati sederhana
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            let jumlah = 100; // Banyaknya hati
            for (let i = 0; i < jumlah; i++) {
                particlesArray.push(new HeartParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Jalankan animasi
        init();
        animate();

        // Resize Handle
        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

    </script>
</body>
</html>
